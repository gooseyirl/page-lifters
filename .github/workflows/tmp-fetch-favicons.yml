# One-off: download the Hardcover favicon into icons/. Removed again before merging.
name: Fetch favicons (temporary)
on:
  push:
    branches: [claude/project-thread-es55cg]
    paths: [.github/workflows/tmp-fetch-favicons.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download icon
        run: |
          set -u
          mkdir -p icons cands
          i=0
          for url in "https://www.google.com/s2/favicons?domain=hardcover.app&sz=128" "https://icons.duckduckgo.com/ip3/hardcover.app.ico" "https://www.google.com/s2/favicons?domain=hardcover.app&sz=64"; do
            i=$((i+1))
            code=$(curl -sSL -o "cands/$i" -w "%{http_code}" "$url" || echo err)
            echo "$code $(file -b "cands/$i") $url"
          done
          # Keep every candidate so they can be looked at; the page picks one later.
          cp cands/1 icons/hardcover-google128.png || true
          cp cands/2 icons/hardcover-ddg.ico || true
          ls -la icons
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add icons
          git diff --cached --quiet && { echo "nothing found"; exit 1; }
          git commit -m "Add Hardcover favicon"
          git push
